- title: Robotics & Embodied AI
  description: >
    Perception, manipulation, and imitation learning for real-world robots -
    from RGB-D sensing and 3D scene understanding to force-constrained,
    collision-aware manipulation.
- title: AI for Collaborative Learning
  description: >
    LLM-based systems that support group learning in classrooms by guiding
    student discussions, providing contextual feedback, and surfacing insights
    to teachers in real time.
- title: Multimodal AI & Conversational Interfaces
  description: >
    Systems that combine speech, text, and retrieval to enable context-aware AI
    assistants and more natural human–AI interaction.
- title: Evaluation of LLM-Based Systems
  description: >
    Benchmarks and experimental methodology for testing the reliability and
    usefulness of LLM-based systems in real-world applications.
