# Bio is Markdown so it is easy to edit. Inline links are supported.
bio: >
  I am a second-year MS Computer Science student at the
  [University of Colorado Boulder](https://www.colorado.edu). I am a member of the
  [HIRO Group](https://hiro-group.ronc.one) under Professor
  Alessandro Roncone, and I work as a Graduate Researcher at the
  [NSF AI Institute for Student-AI Teaming (iSAT)](https://www.colorado.edu/research/ai-institute/),
  advised by Peter Foltz.


  My research spans **robotics and embodied AI** - perception, manipulation, and
  imitation learning - as well as **AI for collaborative learning**, where I
  build and evaluate LLM-based systems that support group learning in
  classrooms. My work draws on large language models, retrieval-augmented
  generation (RAG), and multimodal systems that combine speech, text, and
  retrieval for context-aware assistants.


  I earned my BS in Computer Science from the
  [Lahore University of Management Sciences (LUMS)](https://lums.edu.pk) in
  Pakistan, with a focus on NLP, deep learning, and computer vision. My
  long-term goal is a **PhD in robotics**, followed by R&D work in the field.
